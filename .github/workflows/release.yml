name: release

# Push a tag `vX.Y.Z` whose version matches BOTH packages' package.json.
# Publishing uses npm Trusted Publishing (OIDC): there is no NPM_TOKEN secret.
# Each package must have this repository + workflow registered as its Trusted
# Publisher on npmjs.com (see RELEASING.md).

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag can be pushed on any commit, including one that never reached
      # main (a local branch, an unreviewed experiment). Only commits already on
      # main are released.
      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on origin/main — refusing to publish"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1

      - name: Tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in core vue; do
            v="$(node -p "require('./packages/$p/package.json').version")"
            if [ "$v" != "$tag" ]; then
              echo "::error::tag v$tag but packages/$p/package.json is $v"
              exit 1
            fi
          done
          dep="$(node -p "require('./packages/vue/package.json').dependencies['@hayrat/hesabim-core']")"
          echo "vue -> core dependency range: $dep"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # core first: vue depends on it. A version already on the registry is
      # skipped so that a re-run after a partial failure finishes the job.
      - name: Publish
        run: |
          for pkg in @hayrat/hesabim-core @hayrat/hesabim-vue; do
            v="$(npm pkg get version --workspace "$pkg" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(Object.values(JSON.parse(s))[0]))')"
            if npm view "$pkg@$v" version >/dev/null 2>&1; then
              echo "$pkg@$v already published — skipping"
              continue
            fi
            npm publish --workspace "$pkg" --access public --provenance
          done
